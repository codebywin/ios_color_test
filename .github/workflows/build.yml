name: Build Color Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg

      - name: Setup RootHide Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build RootHide package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: color-test-roothide
          path: packages/*.deb
          if-no-files-found: error
